name: Build portable apps

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional: vorhandenen Release-Tag ohne v direkt veröffentlichen'
        required: false
        type: string
      confirmation:
        description: 'Bei release_version exakt RELEASE eingeben'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare_release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate and prepare release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.release_version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Ungültige Version" >&2; exit 1; }
            [[ "$INPUT_CONFIRMATION" == "RELEASE" ]] || { echo "Bestätigung muss RELEASE lauten" >&2; exit 1; }
            tag="v$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "LW-Manager $tag" --generate-notes --verify-tag
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare_release
    if: always() && (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LW-Manager-windows-x64
            args: -platform windows/amd64
          - os: macos-15-intel
            artifact: LW-Manager-macos-intel
            args: -platform darwin/amd64
          - os: macos-15
            artifact: LW-Manager-macos-arm64
            args: -platform darwin/arm64
          - os: ubuntu-24.04
            artifact: LW-Manager-linux-x64
            args: -platform linux/amd64 -tags webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Determine application version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "APP_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(sed -n 's/^var appVersion = "\([^"]*\)"$/\1/p' app.go)" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        run: wails build ${{ matrix.args }} -clean -ldflags "-X main.appVersion=${APP_VERSION}"
      - name: Stage portable layout
        shell: bash
        run: |
          mkdir -p package/data/logs package/data/cache package/assets/models package/assets/thumbnails
          touch package/.vaultapp
          cp -R build/bin/* package/
          cp README.md package/
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp scripts/macos-start.command package/LW-Manager-starten.command
            chmod +x package/LW-Manager-starten.command
          fi
      - name: Package and verify Windows release archive
        if: needs.prepare_release.result == 'success' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $archive = "release/${{ matrix.artifact }}.zip"
          $archivePath = Join-Path $PWD $archive
          $packagePath = (Resolve-Path package).Path
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $packagePath,
            $archivePath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($entries -notcontains '.vaultapp') {
              throw 'Windows release ZIP does not contain the portable .vaultapp marker.'
            }
            if ($entries -notcontains 'LW-Manager.exe') {
              throw 'Windows release ZIP does not contain LW-Manager.exe.'
            }
          } finally {
            $zip.Dispose()
          }
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package and verify Unix release archive
        if: needs.prepare_release.result == 'success' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          archive="release/${{ matrix.artifact }}.tar.gz"
          tar -czf "$archive" -C package .
          tar -tzf "$archive" >/dev/null
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload permanent release asset
        if: needs.prepare_release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: needs.prepare_release.result == 'skipped'
        with:
          name: ${{ matrix.artifact }}
          path: package
          include-hidden-files: true
          if-no-files-found: error

  release_checksums:
    if: always() && needs.prepare_release.result == 'success' && needs.build.result == 'success'
    needs: [prepare_release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download permanent release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'LW-Manager-*' --dir release
      - name: Create and upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: |
          (cd release && sha256sum LW-Manager-* > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
